version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    # IT and unit-test fixture POMs pin old versions on purpose
    exclude-paths:
      - "src/it/**"
      - "src/test/resources/**"
      - "src/test/projects/**"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # plexus-xml 4.x depends on the Maven 4 XML API
      - dependency-name: "org.codehaus.plexus:plexus-xml"
        versions: [">= 4.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
